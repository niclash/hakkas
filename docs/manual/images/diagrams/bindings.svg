<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="system-ui, sans-serif" font-size="14">
  <title>Process ports bound to channels</title>
  <rect width="760" height="300" fill="#ffffff"/>
  <!-- process -->
  <rect x="20" y="20" width="300" height="260" rx="8" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="40" y="48" font-weight="600" font-size="16">Process "Air Handling Unit"</text>
  <text x="40" y="70" fill="#4a5568">its ports: names, no addresses</text>
  <g font-family="ui-monospace, monospace" font-size="13">
    <rect x="130" y="95" width="200" height="28" rx="4" fill="#2b6cb0"/>
    <text x="140" y="114" fill="#fff">→ outdoor_temperature</text>
    <rect x="130" y="135" width="200" height="28" rx="4" fill="#2b6cb0"/>
    <text x="140" y="154" fill="#fff">→ supply_temperature</text>
    <rect x="130" y="195" width="200" height="28" rx="4" fill="#2b6cb0"/>
    <text x="140" y="214" fill="#fff">heating_valve →</text>
    <rect x="130" y="235" width="200" height="28" rx="4" fill="#2b6cb0"/>
    <text x="140" y="254" fill="#fff">supply_fan →</text>
  </g>
  <text x="40" y="133" fill="#4a5568">in</text>
  <text x="40" y="233" fill="#4a5568">out</text>
  <!-- device -->
  <rect x="470" y="20" width="270" height="260" rx="8" fill="#f7fafc" stroke="#4a5568" stroke-width="2"/>
  <text x="490" y="48" font-weight="600" font-size="16">Controller "ahu"</text>
  <text x="490" y="70" fill="#4a5568">its environment: channels</text>
  <g font-family="ui-monospace, monospace" font-size="13">
    <rect x="460" y="95" width="200" height="28" rx="4" fill="#e2e8f0" stroke="#4a5568"/>
    <text x="470" y="114">slot1-ai[1]  Pt1000 °C</text>
    <rect x="460" y="135" width="200" height="28" rx="4" fill="#e2e8f0" stroke="#4a5568"/>
    <text x="470" y="154">slot1-ai[2]  Pt1000 °C</text>
    <rect x="460" y="195" width="200" height="28" rx="4" fill="#e2e8f0" stroke="#4a5568"/>
    <text x="470" y="214">slot4-aq[1]  0–10 V</text>
    <rect x="460" y="235" width="200" height="28" rx="4" fill="#e2e8f0" stroke="#4a5568"/>
    <text x="470" y="254">slot6-dq[1]  output</text>
  </g>
  <g stroke="#c05621" stroke-width="2" stroke-dasharray="6 4">
    <line x1="330" y1="109" x2="460" y2="109"/>
    <line x1="330" y1="149" x2="460" y2="149"/>
    <line x1="330" y1="209" x2="460" y2="209"/>
    <line x1="330" y1="249" x2="460" y2="249"/>
  </g>
  <text x="395" y="185" text-anchor="middle" fill="#c05621" font-weight="600">bindings</text>
</svg>
