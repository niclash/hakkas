<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="system-ui, sans-serif" font-size="14">
  <title>Only changes propagate</title>
  <rect width="760" height="250" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <!-- channel -->
  <rect x="20" y="70" width="130" height="60" rx="6" fill="#edf2f7" stroke="#4a5568"/>
  <text x="85" y="95" text-anchor="middle" font-weight="600">slot3-ai[2]</text>
  <text x="85" y="115" text-anchor="middle" fill="#4a5568">room sensor</text>
  <!-- blocks -->
  <rect x="220" y="60" width="150" height="80" rx="6" fill="#fff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="295" y="88" text-anchor="middle" font-weight="600">room_air</text>
  <text x="295" y="110" text-anchor="middle" fill="#4a5568">process/Deadband</text>
  <rect x="440" y="60" width="150" height="80" rx="6" fill="#fff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="515" y="88" text-anchor="middle" font-weight="600">heat</text>
  <text x="515" y="110" text-anchor="middle" fill="#4a5568">process/Hysteresis</text>
  <rect x="640" y="70" width="100" height="60" rx="6" fill="#edf2f7" stroke="#4a5568"/>
  <text x="690" y="95" text-anchor="middle" font-weight="600">slot6-dq[1]</text>
  <text x="690" y="115" text-anchor="middle" fill="#4a5568">relay</text>
  <line x1="150" y1="100" x2="216" y2="100" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/>
  <line x1="370" y1="100" x2="436" y2="100" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/>
  <line x1="590" y1="100" x2="636" y2="100" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/>
  <!-- event 1 -->
  <text x="20" y="30" font-weight="600" fill="#2f855a">20.50 → 20.46</text>
  <text x="20" y="48" fill="#2f855a">the sensor changes a little</text>
  <path d="M230,40 L300,40" stroke="#2f855a" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <text x="310" y="36" fill="#2f855a">room_air computes: less than its deadband (0.1),</text>
  <text x="310" y="54" fill="#2f855a">so its output stays; nothing more happens</text>
  <!-- event 2 -->
  <text x="20" y="180" font-weight="600" fill="#c05621">20.46 → 19.80</text>
  <text x="20" y="198" fill="#c05621">a real change</text>
  <path d="M230,190 L640,190" stroke="#c05621" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <text x="230" y="216" fill="#c05621">room_air passes it on; heat computes and switches on; the relay is written</text>
  <text x="230" y="234" fill="#4a5568">Nothing else in the process computes: only the blocks the change reaches.</text>
</svg>
